<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search matrimony profiles on Rishta.com. Filter by age, religion, city, education and find your perfect match.">
<title>Search Profiles - Rishta.com</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
<style>
body { padding-top: var(--navbar-height); background: var(--off-white); }
.search-hero { background: linear-gradient(135deg, var(--red), var(--red-dark)); padding: 32px 0; text-align: center; }
.search-hero h1 { font-family: var(--font-display); font-size: clamp(22px,4vw,36px); color: white; font-weight: 700; margin-bottom: 6px; }
.search-hero p { font-size: 15px; color: rgba(255,255,255,0.8); }
.filters-bar { background: white; padding: 20px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.08); position: sticky; top: var(--navbar-height); z-index: 100; }
.filters-inner { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filters-inner .form-group { min-width: 130px; flex: 1; }
.filters-inner .form-group label { font-size: 11px; }
.filter-btn { padding: 11px 20px; white-space: nowrap; }
.results-area { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }
.results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
.results-count { font-size: 15px; color: var(--gray); }
.results-count strong { color: var(--text); font-weight: 700; }
.sort-select { padding: 9px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 13px; background: white; }
.profiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.load-more { text-align: center; margin-top: 40px; }
.no-results { text-align: center; padding: 60px 20px; }
.no-results .emoji { font-size: 60px; margin-bottom: 16px; }
/* Filter sidebar (desktop) */
.search-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
.filter-sidebar { background: white; border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); position: sticky; top: calc(var(--navbar-height) + 80px); }
.filter-sidebar h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--dark); }
.filter-group { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-group:last-child { border: none; margin: 0; padding: 0; }
.filter-group label { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 8px; }
.range-row { display: flex; gap: 8px; }
.range-row select { flex: 1; }
@media (max-width: 900px) { .search-layout { grid-template-columns: 1fr; } .filter-sidebar { display: none; } .profiles-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 500px) { .profiles-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="header-placeholder"></div>

<div class="search-hero">
  <div class="container">
    <h1>🔍 Find Your Perfect Match</h1>
    <p>2,847 verified profiles available — use filters to narrow down</p>
  </div>
</div>

<!-- Sticky Filter Bar (mobile/tablet) -->
<div class="filters-bar">
  <div class="container">
    <div class="filters-inner">
      <div class="form-group"><label>Gender</label><select class="form-control" id="fGender"><option>Any</option><option>Female</option><option>Male</option></select></div>
      <div class="form-group"><label>Age (Min)</label><select class="form-control" id="fAgeMin"><option>18</option><option>20</option><option>22</option><option>24</option><option>26</option><option>28</option><option>30</option></select></div>
      <div class="form-group"><label>Age (Max)</label><select class="form-control" id="fAgeMax"><option>35</option><option>30</option><option>32</option><option>38</option><option>40</option><option>45</option></select></div>
      <div class="form-group"><label>Religion</label><select class="form-control" id="fReligion"><option>Any</option><option>Hindu</option><option>Muslim</option><option>Sikh</option><option>Christian</option><option>Jain</option></select></div>
      <div class="form-group"><label>City</label><select class="form-control" id="fCity"><option>Any</option><option>Delhi</option><option>Mumbai</option><option>Bangalore</option><option>Hyderabad</option><option>Chennai</option><option>Pune</option><option>Ahmedabad</option></select></div>
      <div class="form-group"><label>Education</label><select class="form-control" id="fEdu"><option>Any</option><option>Graduate</option><option>Post Graduate</option><option>PhD</option><option>Professional</option></select></div>
      <button class="btn btn-primary filter-btn" onclick="applyFilters()">🔍 Search</button>
      <button class="btn btn-outline filter-btn" onclick="resetFilters()">Reset</button>
    </div>
  </div>
</div>

<div class="container results-area">
  <div class="search-layout">

    <!-- Sidebar Filters (desktop) -->
    <div class="filter-sidebar">
      <h3>⚙️ Refine Search</h3>
      <div class="filter-group">
        <label>Looking For</label>
        <select class="form-control"><option>Any</option><option>Female</option><option>Male</option></select>
      </div>
      <div class="filter-group">
        <label>Age Range</label>
        <div class="range-row">
          <select class="form-control"><option>22</option><option>24</option><option>26</option><option>28</option><option>30</option></select>
          <select class="form-control"><option>35</option><option>30</option><option>32</option><option>38</option><option>40</option></select>
        </div>
      </div>
      <div class="filter-group">
        <label>Religion</label>
        <select class="form-control"><option>Any</option><option>Hindu</option><option>Muslim</option><option>Sikh</option><option>Christian</option><option>Jain</option></select>
      </div>
      <div class="filter-group">
        <label>Mother Tongue</label>
        <select class="form-control"><option>Any</option><option>Hindi</option><option>Tamil</option><option>Telugu</option><option>Marathi</option><option>Punjabi</option><option>Bengali</option></select>
      </div>
      <div class="filter-group">
        <label>Education</label>
        <select class="form-control"><option>Any</option><option>Graduate</option><option>Post Graduate</option><option>PhD</option><option>Professional Degree</option></select>
      </div>
      <div class="filter-group">
        <label>City</label>
        <select class="form-control"><option>Any</option><option>Delhi</option><option>Mumbai</option><option>Bangalore</option><option>Hyderabad</option><option>Chennai</option></select>
      </div>
      <div class="filter-group">
        <label>Annual Income</label>
        <select class="form-control"><option>Any</option><option>Below 3 LPA</option><option>3–5 LPA</option><option>5–10 LPA</option><option>10–20 LPA</option><option>20+ LPA</option></select>
      </div>
      <button class="btn btn-primary btn-full" onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- Results -->
    <div>
      <div class="results-bar">
        <div class="results-count">Showing <strong id="resultCount">8</strong> profiles</div>
        <select class="sort-select" onchange="sortProfiles(this.value)">
          <option value="new">Newest First</option>
          <option value="age-asc">Age: Low to High</option>
          <option value="age-desc">Age: High to Low</option>
        </select>
      </div>
      <div class="profiles-grid" id="searchGrid"></div>
      <div class="load-more">
        <button class="btn btn-outline btn-lg" onclick="showToast('Register to see more profiles!')">Load More Profiles</button>
      </div>
    </div>

  </div>
</div>

<div id="footer-placeholder"></div>

<script>
const profiles = [
  {id:1,name:"Priya Sharma",age:26,city:"Delhi",religion:"Hindu",profession:"Software Engineer",edu:"B.Tech",photo:"👩",caste:"Brahmin",height:"5'4\"",salary:"8 LPA",gender:"female"},
  {id:2,name:"Anjali Verma",age:24,city:"Mumbai",religion:"Hindu",profession:"Doctor",edu:"MBBS",photo:"👩",caste:"Kshatriya",height:"5'3\"",salary:"12 LPA",gender:"female"},
  {id:3,name:"Riya Patel",age:28,city:"Ahmedabad",religion:"Jain",profession:"CA",edu:"CA",photo:"👩",caste:"Patel",height:"5'2\"",salary:"10 LPA",gender:"female"},
  {id:4,name:"Sneha Reddy",age:25,city:"Hyderabad",religion:"Hindu",profession:"Teacher",edu:"M.Ed",photo:"👩",caste:"Reddy",height:"5'5\"",salary:"5 LPA",gender:"female"},
  {id:5,name:"Fatima Khan",age:27,city:"Lucknow",religion:"Muslim",profession:"Architect",edu:"B.Arch",photo:"👩",caste:"Sunni",height:"5'4\"",salary:"7 LPA",gender:"female"},
  {id:6,name:"Gurpreet Kaur",age:29,city:"Chandigarh",religion:"Sikh",profession:"Nurse",edu:"B.Sc Nursing",photo:"👩",caste:"Jatt",height:"5'3\"",salary:"6 LPA",gender:"female"},
  {id:7,name:"Rahul Gupta",age:28,city:"Bangalore",religion:"Hindu",profession:"Data Scientist",edu:"M.Tech",photo:"👨",caste:"Brahmin",height:"5'10\"",salary:"18 LPA",gender:"male"},
  {id:8,name:"Arjun Singh",age:31,city:"Pune",religion:"Hindu",profession:"Manager",edu:"MBA",photo:"👨",caste:"Rajput",height:"6'0\"",salary:"25 LPA",gender:"male"},
];

let filteredProfiles = [...profiles];

function renderGrid(data) {
  const grid = document.getElementById('searchGrid');
  document.getElementById('resultCount').textContent = data.length;
  if(!data.length) { grid.innerHTML = `<div class="no-results" style="grid-column:1/-1"><div class="emoji">🔍</div><h3>No profiles found</h3><p>Try adjusting your filters</p></div>`; return; }
  grid.innerHTML = data.map(p => {
    const bg = p.gender==='female' ? 'linear-gradient(135deg,#FDECEA,#FFF3CD)' : 'linear-gradient(135deg,#E8F8F5,#EBF5FB)';
    return `<div class="profile-card" onclick="location.href='profile.html?id=${p.id}'">
      <div class="profile-photo-wrap" style="background:${bg}">${p.photo}</div>
      <div class="profile-card-body">
        <div class="profile-name">${p.name}</div>
        <div class="verified">✅ Verified</div>
        <div class="profile-meta">🎂 ${p.age} yrs &nbsp;|&nbsp; 📍 ${p.city}<br>💼 ${p.profession} &nbsp;|&nbsp; 📚 ${p.edu}</div>
        <div class="profile-tags">
          <span class="profile-tag">${p.religion}</span>
          <span class="profile-tag gold">${p.caste}</span>
          <span class="profile-tag">${p.height}</span>
        </div>
        <div class="profile-card-actions">
          <button class="btn-interest" onclick="event.stopPropagation();showToast('Interest sent! ❤️')">❤️ Interest</button>
          <button class="btn-view-profile" onclick="event.stopPropagation();location.href='profile.html?id=${p.id}'">View</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function applyFilters() {
  filteredProfiles = [...profiles];
  renderGrid(filteredProfiles);
  showToast(`Found ${filteredProfiles.length} profiles!`);
}
function resetFilters() { filteredProfiles = [...profiles]; renderGrid(filteredProfiles); }
function sortProfiles(val) {
  if(val==='age-asc') filteredProfiles.sort((a,b)=>a.age-b.age);
  else if(val==='age-desc') filteredProfiles.sort((a,b)=>b.age-a.age);
  else filteredProfiles.sort((a,b)=>a.id-b.id);
  renderGrid(filteredProfiles);
}

document.addEventListener('DOMContentLoaded', () => {
  renderGrid(profiles);
  loadHTML('header-placeholder','header.html');
  loadHTML('footer-placeholder','footer.html');
});

async function loadHTML(id, file) {
  try { const r = await fetch(file); if(r.ok) document.getElementById(id).innerHTML = await r.text(); } catch(e) {}
}
function showToast(msg,type='success'){const t=document.getElementById('toast');if(!t)return;document.getElementById('toastMsg').textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),3500);}
function openModal(id){const m=document.getElementById(id);if(m){m.classList.add('active');document.body.style.overflow='hidden';}}
function closeModal(id){const m=document.getElementById(id);if(m){m.classList.remove('active');document.body.style.overflow='';}}
</script>
</body>
</html>
