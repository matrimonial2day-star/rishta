<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RishtaBandhan</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">❤</span>
        <span class="logo-text">RishtaBandhan</span>
      </a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card" style="animation: fadeInUp 0.6s ease both">
      <div style="text-align:center;margin-bottom:32px">
        <div style="font-size:3rem;margin-bottom:8px">❤️</div>
        <h2>Welcome Back!</h2>
        <p class="subtitle">Apne account mein login karein</p>
      </div>

      <div id="loginAlert"></div>

      <div class="form-group">
        <label>Email / Mobile Number</label>
        <input type="text" id="loginEmail" placeholder="Email ya mobile number darj karein" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="loginPassword" placeholder="Password darj karein" style="padding-right:48px" />
          <button onclick="togglePwd('loginPassword',this)" type="button"
                  style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light)">
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
        <label class="checkbox-item" style="font-size:0.88rem">
          <input type="checkbox" /> Remember me
        </label>
        <a href="#" style="font-size:0.88rem;color:var(--primary);font-weight:600">Forgot Password?</a>
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i> Login Karein
      </button>

      <div class="form-divider">ya</div>

      <button class="btn btn-outline btn-full" onclick="demoLogin()">
        <i class="fas fa-user-circle"></i> Demo Account se Login
      </button>

      <p style="text-align:center;margin-top:24px;font-size:0.9rem;color:var(--text-light)">
        Naya account nahi hai? 
        <a href="register.html" style="color:var(--primary);font-weight:700">Free Register Karein</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="far fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="far fa-eye"></i>';
      }
    }

    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      const alert = document.getElementById('loginAlert');

      if (!email || !pwd) {
        alert.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Sab fields fill karein!</div>';
        return;
      }

      // Check from registered users
      const users = JSON.parse(localStorage.getItem('rishta_users') || '[]');
      const user = users.find(u => (u.email === email || u.phone === email) && u.password === pwd);

      if (user) {
        localStorage.setItem('rishta_user', JSON.stringify(user));
        showToast('Login successful! Welcome back! 🎉');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        alert.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Email/Password galat hai!</div>';
      }
    }

    function demoLogin() {
      const demoUser = {
        id: 'DEMO001', name: 'Demo User', email: 'demo@rishtabandhan.com',
        gender: 'male', age: 28, city: 'Delhi', membership: 'premium'
      };
      localStorage.setItem('rishta_user', JSON.stringify(demoUser));
      showToast('Demo account se login hua! 🎉');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }

    document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
